aid: consol-energy
name: CONSOL Energy
description: >-
  CONSOL Energy was a Pittsburgh-based bituminous coal producer serving electric
  utilities, steelmakers and industrial customers. In January 2025 it merged with
  Arch Resources to form Core Natural Resources, Inc. (NYSE: CNR), and
  consolenergy.com now 301-redirects to corenaturalresources.com. The company
  publishes no developer portal, no API documentation, no SDKs and no GitHub
  organization — but it runs its corporate site on WordPress and serves the
  WordPress REST API anonymously at https://corenaturalresources.com/wp-json/, a
  real machine-readable read surface with custom post types for mines (11, with
  an East/West taxonomy), leadership (16) and news releases (40), plus pages and
  a 173-item media library holding the supplier terms, Supplier Code of Conduct
  and sustainability PDFs. Each endpoint was called anonymously on 2026-09-05;
  writes and admin routes are authenticated (401). Financial data stays
  third-party, via the SEC EDGAR APIs. See arch-coal for the other merger half.
