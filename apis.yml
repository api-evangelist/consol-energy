  - SEC EDGAR
  - Third-Party
  properties:
  - type: Documentation
    url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  - type: APIReference
    url: https://data.sec.gov/submissions/CIK0001710366.json
  x-evidence:
    verified: '2026-07-25'
    method: fetched documentation and called the endpoint
    documentation: >-
      The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov — https://data.sec.gov/submissions/CIK##########.json
      plus the XBRL companyconcept, companyfacts, and frames APIs. No authentication or API key required;
      a declared User-Agent and a 10-request-per-second ceiling are the stated fair-access terms.
    endpoint_check: >-
      GET https://data.sec.gov/submissions/CIK0001710366.json returned HTTP 200 with JSON naming "Core
      Natural Resources, Inc.", ticker CNR, and the former name "CONSOL Energy Inc." through 2025-01-10.
    reverified: '2026-09-05'
    reverify_note: >-
      Re-probed 2026-09-05. The documentation page returns HTTP 403 to a generic browser User-Agent and
      HTTP 200 to a declared one; the endpoint returned HTTP 200.
