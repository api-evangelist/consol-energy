- aid: consol-energy:sec-edgar-filings
  name: SEC EDGAR Filings (Core Natural Resources, CIK 1710366)
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/consol-energy.png
  description: >-
    Machine-readable filing data for the post-merger company is published by the U.S. Securities and Exchange
    Commission, not by the company itself. CIK 0001710366 is the CONSOL Energy Inc. registrant, renamed
    Core Natural Resources in January 2025, so this covers CONSOL's filing history as well as the merged
    company's. Listed as a third-party government API.
  humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  baseURL: https://data.sec.gov
  tags:
  - Filings
  - SEC EDGAR
  - Third Party
