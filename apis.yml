apis:
  - aid: consol-energy:sec-edgar-filings
    name: SEC EDGAR Filings (Core Natural Resources, CIK 1710366)
    description: >-
      Machine-readable filing data for the post-merger company is published by
      the U.S. Securities and Exchange Commission, not by the company itself.
      CIK 0001710366 is the CONSOL Energy Inc. registrant, renamed Core Natural
      Resources in January 2025, so this covers CONSOL's filing history as well
      as the merged company's. Listed as a third-party government API.
    humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    tags:
      - Filings
      - SEC EDGAR
      - Third Party
    tags_raw:
      - Filings
      - SEC EDGAR
      - Third-Party
    properties:
      - type: Documentation
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - type: APIReference
        url: https://data.sec.gov/submissions/CIK0001710366.json
    x-evidence:
      verified: '2026-07-25'
      method: fetched documentation and called the endpoint
      documentation: >-
        The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov —
        https://data.sec.gov/submissions/CIK##########.json plus the XBRL
        companyconcept, companyfacts, and frames APIs. No authentication or API
        key required; a declared User-Agent and a 10-request-per-second ceiling
        are the stated fair-access terms.
      endpoint_check: >-
        GET https://data.sec.gov/submissions/CIK0001710366.json returned HTTP
        200 with JSON naming "Core Natural Resources, Inc.", ticker CNR, and
        the former name "CONSOL Energy Inc." through 2025-01-10.
