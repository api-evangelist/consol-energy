description: >-
  Core Natural Resources (formerly CONSOL Energy) sells coal, not software. It
  publishes no pricing page, no plans, no developer sign-up and no API product.
  The one first-party machine-readable surface on its host — the WordPress REST
  API behind the corporate site — is free, anonymous and unmetered, and is not
  offered or sold as a product. Coal is sold under negotiated supply contracts
  and disclosed in SEC filings, not on a plans page.
