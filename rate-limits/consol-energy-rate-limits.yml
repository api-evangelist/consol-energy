description: >-
  Core Natural Resources (formerly CONSOL Energy) publishes no rate-limit
  documentation of any kind, and its public WordPress REST API returns no
  rate-limit headers. Response headers were inspected on collection and error
  responses on 2026-09-05: no RateLimit-*, no X-RateLimit-*, no Retry-After.
  The only enforced ceiling observed is a per-request page size cap of 100
  (per_page > 100 returns HTTP 400 rest_invalid_param), which is a validation
  bound rather than a rate limit. An honest zero.
notes: >-
  For the third-party SEC EDGAR API listed on this record, the SEC — not this
  company — states a fair-access ceiling of 10 requests per second and requires a
  declared User-Agent. That limit belongs to sec.gov and is not counted here.
