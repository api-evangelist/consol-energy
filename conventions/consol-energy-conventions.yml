note: >-
  The company documents none of this. Every convention below was observed on the
  wire or read out of the route discovery document the host serves.
authentication:
  style: none for reads; WordPress cookie+X-WP-Nonce or Application Passwords (HTTP Basic) for writes
  see: authentication/consol-energy-authentication.yml
pagination:
  style: page-number
  params:
    page: 1-based page index (default 1)
    per_page: 1-100 (default 10); 999 returns 400 rest_invalid_param
    offset: alternative absolute offset
  response_headers:
    X-WP-Total: total matching records
    X-WP-TotalPages: total pages available
    Link: RFC 8288 rel="prev" / rel="next"
  cors_exposed: true
  cors_note: Access-Control-Expose-Headers advertises X-WP-Total, X-WP-TotalPages and Link, so a browser client can read them.
  evidence: 'GET /wp/v2/article?per_page=2&page=2 -> x-wp-total: 40, x-wp-totalpages: 20, RFC 8288 Link header with prev and next'
filtering:
  search: '?search= free text; ?search_columns= restricts to post_title/post_content/post_excerpt'
  ordering: '?orderby= (date, id, title, slug, modified, relevance, include) with ?order=asc|desc'
  by_id: '?include=/?exclude= arrays of IDs'
  by_slug: '?slug= array of slugs'
  by_date: '?after=/?before=/?modified_after=/?modified_before= ISO 8601'
  by_taxonomy: '?mine-location=, ?leader-category=, ?news-series-title= term IDs, each with an _exclude sibling'
sparse_fields:
  supported: true
  param: _fields
  note: '?_fields=id,slug,link,title trims the representation; used to capture the examples/ payloads.'
  embedding: '?_embed expands _links into an _embedded object (WordPress core behaviour).'
metadata:
